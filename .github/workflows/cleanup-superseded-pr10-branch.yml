name: Cleanup superseded PR10 temporary branch

on:
  push:
    branches: [feature/local-server-net8]
    paths:
      - '.github/workflows/cleanup-superseded-pr10-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    if: github.repository == 'kevin840307/TestGoGo'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR10 was closed without merge before deleting its own branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api repos/kevin840307/TestGoGo/pulls/10 --jq '.state')"
          merged="$(gh api repos/kevin840307/TestGoGo/pulls/10 --jq '.merged')"
          if [[ "$state" != "closed" || "$merged" != "false" ]]; then
            echo "Refusing cleanup: PR10 is not the closed superseded work."
            exit 1
          fi
          gh api -X DELETE repos/kevin840307/TestGoGo/git/refs/heads/fix/multiplayer-coalesced-motion-20261111
          echo "Deleted superseded PR10 branch."
