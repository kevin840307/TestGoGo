name: Server AOI priority and build
on:
  push:
    branches:
      - feature/local-server-net8
    paths:
      - 'server/Application/Messaging/ServerBroadcastHub.cs'
      - 'server/Application/Messaging/PlayerSpatialAoi.cs'
      - 'server/Application/Messaging/WorldEntitySpatialAoi.cs'
      - 'server/Transport/WebSockets/WebSocketEndpoint.cs'
      - 'server/Application/Combat/CombatService.cs'
      - 'server/Infrastructure/Persistence/Sqlite/SqliteGameStore.cs'
      - 'server/Application/Abstractions/GameStorePorts.cs'
      - 'server/Application/World/SharedMapAiTicker.cs'
      - 'server/Application/PacketRouter.cs'
      - 'server/Application/World/PositionPersistenceService.cs'
      - 'tests/SGO.Server.PositionPersistenceProbe/**'
      - 'tests/SGO.Server.BroadcastPriorityProbe/**'
      - 'tests/SGO.Server.ViewportAoiProbe/**'
      - '.github/workflows/server-aoi-priority.yml'
  pull_request:
    branches: [feature/local-server-net8]
    paths:
      - 'server/Application/Messaging/ServerBroadcastHub.cs'
      - 'server/Application/Messaging/PlayerSpatialAoi.cs'
      - 'server/Application/Messaging/WorldEntitySpatialAoi.cs'
      - 'server/Application/World/PositionPersistenceService.cs'
      - 'server/Infrastructure/Persistence/Sqlite/SqliteGameStore.cs'
      - 'server/Application/Abstractions/GameStorePorts.cs'
      - 'tests/SGO.Server.PositionPersistenceProbe/**'
      - 'tests/SGO.Server.BroadcastPriorityProbe/**'
      - 'tests/SGO.Server.ViewportAoiProbe/**'
      - '.github/workflows/server-aoi-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build .NET 8 game server
        run: dotnet build server/SGO.Server.csproj --configuration Release --nologo
      - name: Check player AOI priority without dropping monsters or ground items
        run: dotnet run --configuration Release --project tests/SGO.Server.BroadcastPriorityProbe/SGO.Server.BroadcastPriorityProbe.csproj --nologo
      - name: Verify staged movement and SyncState persistence flush without packet locks
        run: dotnet run --configuration Release --project tests/SGO.Server.PositionPersistenceProbe/SGO.Server.PositionPersistenceProbe.csproj --nologo
      - name: Verify stationary camera resize, symmetric peers and moving edge monsters
        run: dotnet run --configuration Release --project tests/SGO.Server.ViewportAoiProbe/SGO.Server.ViewportAoiProbe.csproj --nologo
