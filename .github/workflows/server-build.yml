name: Server build
on:
  push:
    paths: ['server/**', 'client/**/*.gd', 'client/**/*.tscn', 'tests/SGO.Server.SmokeTests/**', 'tests/SGO.Server.WireSmokeTests/**', 'tests/SGO.Server.WireLoadProbe/**', 'tests/SGO.ItemCoverageReport/**', 'tests/SGO.MappingCoverageReport/**', 'tests/SGO.Server.LoadProbe/**', 'tests/packet_contract_audit.py', 'tests/test_packet_contract_audit.py', 'tests/packet_schema_audit.py', 'tests/test_packet_schema_audit.py', 'tests/packet_response_audit.py', 'tests/test_packet_response_audit.py', 'tests/test_packet_log_privacy.py', 'tests/test_client_network_contract.py', 'tests/test_gm_security.py', 'tests/test_mall_external_security.py', 'tests/quest_host_audit.py', 'tests/test_quest_host_audit.py', 'tests/test_smoke_suite_structure.py', 'tests/test_load_probe_structure.py', 'tests/test_wire_load_probe_structure.py', 'tests/test_feature_gap_tracker.py', '.github/workflows/server-build.yml']
  pull_request:
    paths: ['server/**', 'client/**/*.gd', 'client/**/*.tscn', 'tests/SGO.Server.SmokeTests/**', 'tests/SGO.Server.WireSmokeTests/**', 'tests/SGO.Server.WireLoadProbe/**', 'tests/SGO.ItemCoverageReport/**', 'tests/SGO.MappingCoverageReport/**', 'tests/SGO.Server.LoadProbe/**', 'tests/packet_contract_audit.py', 'tests/test_packet_contract_audit.py', 'tests/packet_schema_audit.py', 'tests/test_packet_schema_audit.py', 'tests/packet_response_audit.py', 'tests/test_packet_response_audit.py', 'tests/test_packet_log_privacy.py', 'tests/test_client_network_contract.py', 'tests/test_gm_security.py', 'tests/test_mall_external_security.py', 'tests/quest_host_audit.py', 'tests/test_quest_host_audit.py', 'tests/test_smoke_suite_structure.py', 'tests/test_load_probe_structure.py', 'tests/test_wire_load_probe_structure.py', 'tests/test_feature_gap_tracker.py', '.github/workflows/server-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Packet contract audit
        run: |
          python3 -m unittest discover -s tests -p 'test_packet_contract_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_packet_schema_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_packet_response_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_packet_log_privacy.py' -v
          python3 -m unittest discover -s tests -p 'test_client_network_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_gm_security.py' -v
          python3 -m unittest discover -s tests -p 'test_mall_external_security.py' -v
          python3 -m unittest discover -s tests -p 'test_quest_host_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_smoke_suite_structure.py' -v
          python3 -m unittest discover -s tests -p 'test_load_probe_structure.py' -v
          python3 -m unittest discover -s tests -p 'test_wire_load_probe_structure.py' -v
          python3 -m unittest discover -s tests -p 'test_feature_gap_tracker.py' -v
          python3 tests/packet_contract_audit.py --strict --output packet-contract-report.json
          python3 tests/packet_schema_audit.py --strict --output packet-schema-report.json
          python3 tests/packet_response_audit.py --strict --output packet-response-report.json
          python3 tests/quest_host_audit.py --strict --output quest-host-report.json
      - name: Build server
        run: |
          set -o pipefail
          dotnet build server/SGO.Server.csproj -c Release 2>&1 | tee build.log
      - name: Scripted item coverage report
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.ItemCoverageReport/SGO.ItemCoverageReport.csproj -c Release -- --strict --output item-use-coverage-report.json 2>&1 | tee item-coverage.log
      - name: Historical mapping coverage report
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.MappingCoverageReport/SGO.MappingCoverageReport.csproj -c Release -- --output mapping-coverage-report.json 2>&1 | tee mapping-coverage.log
      - name: Server capacity probe
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.Server.LoadProbe/SGO.Server.LoadProbe.csproj -c Release -- --sizes 10,50,100 --fanout-iterations 200 --db-ops 2 --output load-probe-report.json 2>&1 | tee load-probe.log
      - name: Fast domain smoke tests
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release -- --suite protocol 2>&1 | tee protocol-smoke.log
          dotnet run --no-build --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release -- --suite announcements 2>&1 | tee announcement-smoke.log
          dotnet run --no-build --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release -- --suite world 2>&1 | tee world-smoke.log
          dotnet run --no-build --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release -- --suite concurrency 2>&1 | tee concurrency-smoke.log
      - name: Full game integration smoke
        run: |
          set -o pipefail
          dotnet run --no-build --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release 2>&1 | tee smoke.log
      - name: Build encrypted WebSocket transport tests
        run: |
          dotnet build tests/SGO.Server.WireSmokeTests/SGO.Server.WireSmokeTests.csproj -c Release
          dotnet build tests/SGO.Server.WireLoadProbe/SGO.Server.WireLoadProbe.csproj -c Release
      - name: Encrypted WebSocket transport smoke
        run: |
          set -o pipefail
          export Game__GmCommandsEnabled=true
          (cd server && dotnet bin/Release/net8.0/SGO.Server.dll) > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:5678/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat server.log
            exit 1
          fi
          dotnet run --no-build --project tests/SGO.Server.WireSmokeTests/SGO.Server.WireSmokeTests.csproj -c Release -- ws://127.0.0.1:5678/ 2>&1 | tee wire.log
          dotnet run --no-build --project tests/SGO.Server.WireLoadProbe/SGO.Server.WireLoadProbe.csproj -c Release -- --url ws://127.0.0.1:5678/ --sizes 10,50,100 --rounds 2 --setup-concurrency 10 --timeout-seconds 20 --output wire-load-probe-report.json 2>&1 | tee wire-load-probe.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-logs
          path: |
            build.log
            smoke.log
            protocol-smoke.log
            announcement-smoke.log
            world-smoke.log
            concurrency-smoke.log
            wire.log
            wire-load-probe.log
            wire-load-probe-report.json
            server.log
            packet-contract-report.json
            packet-schema-report.json
            packet-response-report.json
            quest-host-report.json
            item-use-coverage-report.json
            item-coverage.log
            mapping-coverage-report.json
            mapping-coverage.log
            load-probe-report.json
            load-probe.log
          if-no-files-found: ignore
