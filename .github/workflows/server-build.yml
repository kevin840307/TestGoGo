name: Server build
on:
  push:
    paths: ['server/**', 'client/**/*.gd', 'tests/SGO.Server.SmokeTests/**', 'tests/packet_contract_audit.py', 'tests/test_packet_contract_audit.py', 'tests/packet_schema_audit.py', 'tests/test_packet_schema_audit.py', '.github/workflows/server-build.yml']
  pull_request:
    paths: ['server/**', 'client/**/*.gd', 'tests/SGO.Server.SmokeTests/**', 'tests/packet_contract_audit.py', 'tests/test_packet_contract_audit.py', 'tests/packet_schema_audit.py', 'tests/test_packet_schema_audit.py', '.github/workflows/server-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Packet contract audit
        run: |
          python3 -m unittest discover -s tests -p 'test_packet_contract_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_packet_schema_audit.py' -v
          python3 tests/packet_contract_audit.py --strict --output packet-contract-report.json
          python3 tests/packet_schema_audit.py --strict --output packet-schema-report.json
      - name: Build server
        run: |
          set -o pipefail
          dotnet build server/SGO.Server.csproj -c Release 2>&1 | tee build.log
      - name: Smoke tests
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release 2>&1 | tee smoke.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-logs
          path: |
            build.log
            smoke.log
            packet-contract-report.json
            packet-schema-report.json
          if-no-files-found: ignore
