name: Server build
on:
  push:
    paths: ['server/**', 'tests/SGO.Server.SmokeTests/**', '.github/workflows/server-build.yml']
  pull_request:
    paths: ['server/**', 'tests/SGO.Server.SmokeTests/**', '.github/workflows/server-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build server
        run: |
          set -o pipefail
          dotnet build server/SGO.Server.csproj -c Release 2>&1 | tee build.log
      - name: Smoke tests
        run: |
          set -o pipefail
          dotnet run --project tests/SGO.Server.SmokeTests/SGO.Server.SmokeTests.csproj -c Release 2>&1 | tee smoke.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-logs
          path: |
            build.log
            smoke.log
          if-no-files-found: ignore
