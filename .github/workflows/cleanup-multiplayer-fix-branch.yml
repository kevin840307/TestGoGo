# One-time cleanup for the isolated multiplayer fix after successful merge.
# Restricted to this specific PR head; other collaborators' branches untouched.
name: Clean up merged multiplayer fix branch
on:
  pull_request:
    types: [closed]
    branches: [feature/local-server-net8]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'fix/multiplayer-final-position-20261110' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged temporary fix branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/fix/multiplayer-final-position-20261110'
            });
            core.info('Deleted merged fix/multiplayer-final-position-20261110');
