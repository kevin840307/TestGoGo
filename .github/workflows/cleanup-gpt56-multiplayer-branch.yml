# One-time cleanup for the GPT-5.6 multiplayer optimization branch.
# Restricted to this exact temporary branch; collaborators' branches are untouched.
name: Clean up GPT56 multiplayer temp branch

on:
  push:
    branches: [feature/local-server-net8]
    paths:
      - '.github/workflows/cleanup-gpt56-multiplayer-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged temporary branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'heads/perf/multiplayer-motion-coalesce-gpt56';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
            } catch (error) {
              if (error.status === 404) {
                core.info('Temporary branch is already deleted.');
                return;
              }
              throw error;
            }
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref
            });
            core.info('Deleted perf/multiplayer-motion-coalesce-gpt56');
