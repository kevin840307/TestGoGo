name: Godot Client visual allocation contract

on:
  push:
    branches:
      - feature/local-server-net8
    paths:
      - 'client/scripts/game_manager.gd'
      - 'client/scripts/client_performance_profile.gd'
      - 'client/scripts/network_entity_manager.gd'
      - 'client/scripts/floating_text_manager.gd'
      - 'client/network_player.gd'
      - 'client/tests/display_settings_regression.gd'
      - 'tests/test_builtin_entity_simplification_contract.py'
      - 'client/scripts/map_visual_aoi_streamer.gd'
      - 'client/scripts/paper_doll_loader.gd'
      - 'client/scripts/monster_loader.gd'
      - 'client/game_hud.tscn'
      - 'client/game_hud.gd'
      - 'client/tools/build_map_visual_aoi_base.gd'
      - 'tools/Prepare-SGO-MapVisuals.ps1'
      - 'tests/test_client_memory_lifecycle_contract.py'
      - '.github/workflows/client-memory-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map streaming, atlas sharing and viewport lifecycle
        run: python -m unittest discover -s tests -p 'test_client_memory_lifecycle_contract.py' -v
      - name: Godot 4.7.2 headless static visual AOI regression
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p "$RUNNER_TEMP/sgomap/scripts" "$RUNNER_TEMP/sgomap/tests"
          cp client/scripts/map_visual_aoi_streamer.gd "$RUNNER_TEMP/sgomap/scripts/"
          cp client/tests/map_early_detach_regression.gd "$RUNNER_TEMP/sgomap/tests/"
          printf '[application]\\nconfig/name="SGO Synthetic AOI Test"\\n' > "$RUNNER_TEMP/sgomap/project.godot"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/sgomap" --script res://tests/map_early_detach_regression.gd
          cp client/scripts/client_performance_profile.gd "$RUNNER_TEMP/sgomap/scripts/"
          cp client/tests/display_settings_regression.gd "$RUNNER_TEMP/sgomap/tests/"
          cp client/game_hud.tscn "$RUNNER_TEMP/sgomap/"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/sgomap" --script res://tests/display_settings_regression.gd
      - name: Compile atlas loaders in Godot 4.7.2 (minimal autoload stubs)
        shell: bash
        run: |
          set -euo pipefail
          cp client/scripts/monster_loader.gd "$RUNNER_TEMP/sgomap/scripts/"
          cp client/scripts/paper_doll_loader.gd "$RUNNER_TEMP/sgomap/scripts/"
          cp client/scripts/background_cache_trim.gd "$RUNNER_TEMP/sgomap/scripts/"
          cp client/tests/atlas_script_parse_regression.gd "$RUNNER_TEMP/sgomap/tests/"
          printf '%s\n' 'extends Node' 'func get_se_event_candidates(_path: String, _action: String, _frame: int) -> Array:' '    return []' 'func play_se_candidates(_candidates: Array) -> bool:' '    return false' > "$RUNNER_TEMP/sgomap/tests/audio_stub.gd"
          printf '%s\n' 'extends Node' 'func is_loaded() -> bool:' '    return false' 'func get_effective_tick_rate_hz() -> float:' '    return 0.0' 'func get_resource_timeline(_path: String, _action: String) -> Array:' '    return []' > "$RUNNER_TEMP/sgomap/tests/timing_stub.gd"
          printf '%s\n' '[autoload]' 'AudioManager="*res://tests/audio_stub.gd"' 'AnimationTimingManager="*res://tests/timing_stub.gd"' >> "$RUNNER_TEMP/sgomap/project.godot"
          timeout --kill-after=5s 30s "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/sgomap" --script res://tests/atlas_script_parse_regression.gd | tee "$RUNNER_TEMP/atlas-compile.log"
          grep -Fq "[ATLAS_SCRIPT_PARSE_PASS]" "$RUNNER_TEMP/atlas-compile.log"
      - name: Existing HUD and visual performance contracts
        run: |
          python -m unittest discover -s tests -p 'test_client_optional_hud_memory_contract.py' -v
          python -m unittest discover -s tests -p 'test_client_visual_performance_contract.py' -v
          python tests/test_builtin_entity_simplification_contract.py
          python -m unittest discover -s tests -p 'test_afk_mode_contract.py' -v
