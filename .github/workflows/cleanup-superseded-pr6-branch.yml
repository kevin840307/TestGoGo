name: Cleanup superseded PR6 branch

on:
  push:
    branches: [feature/local-server-net8]
    paths:
      - '.github/workflows/cleanup-superseded-pr6-branch.yml'

permissions:
  contents: write

jobs:
  delete-superseded-branch:
    if: github.repository == 'kevin840307/TestGoGo'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the superseded PR6 branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref='heads/perf/viewport-motion-sync-gpt56'
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
            echo "[BRANCH_CLEANUP] deleted perf/viewport-motion-sync-gpt56"
          else
            echo "[BRANCH_CLEANUP] branch already absent"
          fi
