name: Generate Stellar Shock PNG effects

on:
  push:
    paths:
      - "tools/generate_stellar_shock_effect.py"
      - ".github/workflows/generate-stellar-shock-effect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-server-net8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/generate_stellar_shock_effect.py
      - name: Commit generated PNG frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/Assets/Effects/RawData/Skill_Effect/Stellar_Use100.spr.*.png
          git add client/Assets/Effects/RawData/Skill_Effect/Stellar_Hit100.spr.*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: generate Stellar Shock PNG effect frames"
          git push origin HEAD:feature/local-server-net8
