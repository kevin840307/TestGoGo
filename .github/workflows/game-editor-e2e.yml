name: Game editor E2E

on:
  push:
    paths:
      - 'game-editor/**'
      - 'client/tools/export_map_previews.gd'
      - '.github/workflows/game-editor-e2e.yml'
  pull_request:
    paths:
      - 'game-editor/**'
      - 'client/tools/export_map_previews.gd'
      - '.github/workflows/game-editor-e2e.yml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: game-editor
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Chromium E2E
        working-directory: game-editor
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-editor-playwright
          path: |
            game-editor/playwright-report/
            game-editor/test-results/
          if-no-files-found: ignore
