name: Cleanup multiplayer motion v2 temporary branch

on:
  push:
    branches: [feature/local-server-net8]
    paths:
      - '.github/workflows/cleanup-multiplayer-motion-v2-gpt56.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'kevin840307/TestGoGo'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the merged GPT56 multiplayer branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref='heads/fix/multiplayer-motion-v2-gpt56'
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
            echo "[BRANCH_CLEANUP] deleted fix/multiplayer-motion-v2-gpt56"
          else
            echo "[BRANCH_CLEANUP] branch already absent"
          fi
