# One-time cleanup for this collaborative fix. Other feature branches are never touched.
name: Cleanup temporary multiplayer edge branch
on:
  pull_request:
    types: [closed]
    branches: [feature/local-server-net8]

permissions:
  contents: write

jobs:
  remove-merged-temporary-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'codex/multiplayer-edge-motion-20261111' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/codex/multiplayer-edge-motion-20261111"
