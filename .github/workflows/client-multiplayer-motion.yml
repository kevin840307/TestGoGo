name: Godot multiplayer movement regressions

on:
  push:
    branches: [feature/local-server-net8]
    paths:
      - 'client/network_player.gd'
      - 'client/scripts/remote_player_motion.gd'
      - 'client/scripts/multiplayer_motion_audit.gd'
      - 'client/scripts/network_entity_manager.gd'
      - 'client/scripts/network_manager.gd'
      - 'client/scripts/monster_entity.gd'
      - 'client/scripts/monster_waypoint_speed.gd'
      - 'client/tests/monster_chase_regression.gd'
      - 'client/tests/remote_multiplayer_motion_regression.gd'
      - 'client/tests/multiplayer_motion_audit_regression.gd'
      - 'client/tests/monster_waypoint_math_regression.gd'
      - '.github/workflows/client-multiplayer-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 from official Godot release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Run self-contained movement tests without unreleased game assets
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/sgo-motion-test"
          mkdir -p "$project/scripts" "$project/tests"
          printf 'config_version=5\\n[application]\\nconfig/name="SGO Multiplayer Motion Tests"\\n' > "$project/project.godot"
          cp client/scripts/remote_player_motion.gd "$project/scripts/"
          cp client/scripts/multiplayer_motion_audit.gd "$project/scripts/"
          cp client/scripts/monster_waypoint_speed.gd "$project/scripts/"
          cp client/tests/remote_multiplayer_motion_regression.gd "$project/tests/"
          cp client/tests/multiplayer_motion_audit_regression.gd "$project/tests/"
          cp client/tests/monster_waypoint_math_regression.gd "$project/tests/"
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path "$project" --editor --import --quit 2>&1 | tee godot-isolated-import.log
          for script in \
            remote_multiplayer_motion_regression.gd \
            monster_waypoint_math_regression.gd \
            multiplayer_motion_audit_regression.gd; do
            echo "==== $script ===="
            timeout 40s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path "$project" \
              --script "res://tests/$script" 2>&1 | tee -a godot-motion.log
          done
          grep -q '\\[REMOTE_MOTION_TEST\\] ALL PASS' godot-motion.log
          grep -q '\\[MONSTER_WAYPOINT_TEST\\] ALL PASS' godot-motion.log
          grep -q '\\[MOTION_AUDIT\\] ALL PASS' godot-motion.log
      - name: Scene/packet integration regressions (requires original art)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f client/ui/BG_ENEMY_HP.png ] || [ ! -f client/ui/cursor/C_NORMAL.spr.0000.png ]; then
            echo "[SKIP] Full visual/scene tests require original proprietary UI PNGs absent from Git checkout."
            echo "[SKIP] Pure movement and audit tests above still run and must pass."
            exit 0
          fi
          timeout 660s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path client \
            --editor --import --quit 2>&1 | tee godot-import.log
          for script in monster_chase_regression.gd aoi_pre_spawn_move_regression.gd aoi_monster_snapshot_order_regression.gd; do
            echo "==== $script ===="
            timeout 110s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path client \
              --script "res://tests/$script" 2>&1 | tee -a godot-scene.log
          done
      - name: Upload Godot logs for reproducible diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-multiplayer-motion
          retention-days: 7
          path: |
            godot-import.log
            godot-motion.log
            godot-isolated-import.log
            godot-scene.log
